<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트 팜 시뮬레이터 — 교사 화면</title>
<style>
:root{--bg:#0f1720;--panel:#17222e;--panel2:#1d2a38;--line:#2c3d4f;--ink:#e8eef4;
  --dim:#93a7b8;--acc:#4cc9a0;--acc2:#53a8ff;--warn:#ffb545;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font-family:inherit;font-size:14px;cursor:pointer}
.hidden{display:none !important}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:400px}
.card h1{margin:0 0 18px;font-size:20px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:16px;font-family:inherit}
.btn{width:100%;padding:12px;border-radius:10px;border:0;background:var(--acc);color:#06241b;font-weight:700;margin-top:10px}
.msg{margin-top:10px;font-size:14px;min-height:20px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--acc)}
#top{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:10}
#top button,select{padding:8px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:14px}
.spacer{flex:1}
.wrap{padding:16px;max-width:1500px;margin:0 auto}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:130px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border-radius:10px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:var(--panel2);color:var(--dim);font-weight:600;position:sticky;top:52px;cursor:pointer}
tbody tr:hover{background:#1b2836;cursor:pointer}
.sc{font-weight:700;font-variant-numeric:tabular-nums}
.sc.a{color:var(--acc)} .sc.b{color:var(--warn)} .sc.c{color:var(--bad)}
.dot{display:inline-block;width:15px;text-align:center}
.dot.o{color:var(--acc)} .dot.x{color:#51657a}
.overlay{position:fixed;inset:0;background:rgba(5,10,15,.88);z-index:50;overflow:auto;padding:24px}
.sheet{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet h3{font-size:15px;color:var(--acc);margin:18px 0 6px}
pre{background:#0b1218;padding:12px;border-radius:9px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre}
.chk{display:flex;gap:8px;padding:5px 0;font-size:14px}
.chk .ic{width:20px}
.chk.ok .ic{color:var(--acc)} .chk.no .ic{color:var(--bad)}
small{color:var(--dim)}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>🔑 교사 화면</h1>
    <input id="key" type="password" placeholder="교사 키" autocomplete="off">
    <button class="btn" onclick="enter()">열기</button>
    <div class="msg" id="gmsg"></div>
    <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
      <small>키 바꾸기</small>
      <input id="nk" type="password" placeholder="새 키 (6자 이상)" style="margin-top:6px">
      <button class="btn" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:500"
        onclick="changeKey()">위 칸의 현재 키로 바꾸기</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="top">
    <b>스마트 팜 수행평가</b>
    <select id="fClass" onchange="render()"><option value="">전체 반</option></select>
    <select id="fState" onchange="render()">
      <option value="">전체</option><option value="done">제출함</option><option value="none">미제출</option>
    </select>
    <span class="spacer"></span>
    <button onclick="load()">↻ 새로 고침</button>
    <button onclick="csv()">⬇ CSV 내려받기</button>
  </div>
  <div class="wrap">
    <div class="kpis" id="kpis"></div>
    <div style="overflow:auto"><table>
      <thead><tr>
        <th onclick="sortBy('class_no')">반</th><th onclick="sortBy('student_no')">학번</th>
        <th onclick="sortBy('name')">이름</th><th onclick="sortBy('score')">점수</th>
        <th>① 구조</th><th>② 코딩</th><th>③ 센서</th><th>④ 표시</th><th>⑤ 조건반응</th>
        <th onclick="sortBy('elapsed_sec')">소요</th><th>제출</th><th onclick="sortBy('created_at')">시각</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </div>
</div>

<script>
const SB_URL = "https://xiyzesbtxrpkistruaii.supabase.co";
const SB_KEY = "sb_publishable_c3OU2e6nmA5DNKhqfLbxvQ_GFZiw47u";
const ORDER = ["structure","code","sensor","display","condition"];
let KEY = "", ROWS = [], sortKey = "class_no", sortDir = 1;

async function rpc(fn, args){
  try{
    const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST",
      headers:{apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, "Content-Type":"application/json"},
      body: JSON.stringify(args)});
    if(!r.ok) return {ok:false, error:"서버 오류 ("+r.status+")"};
    return await r.json();
  }catch(e){ return {ok:false, error:"네트워크 오류"}; }
}
async function enter(){
  const k = key.value; if(!k) return msg("키를 입력하세요.", true);
  msg("확인 중…"); const res = await rpc("sf_teacher_list", {p_key:k});
  if(!res.ok) return msg(res.error, true);
  KEY = k; try{ sessionStorage.setItem("sf_key", k); }catch(e){}
  ROWS = res.rows || [];
  gate.classList.add("hidden"); app.classList.remove("hidden");
  fillClasses(); render();
}
async function changeKey(){
  if(!key.value || !nk.value) return msg("현재 키와 새 키를 모두 입력하세요.", true);
  const r = await rpc("sf_teacher_set_key", {p_old:key.value, p_new:nk.value});
  msg(r.ok ? "키를 바꿨습니다." : r.error, !r.ok);
  if(r.ok) nk.value = "";
}
function msg(t, e){ gmsg.textContent = t; gmsg.className = "msg " + (e?"err":"ok"); }
async function load(){
  const res = await rpc("sf_teacher_list", {p_key:KEY});
  if(res.ok){ ROWS = res.rows || []; fillClasses(); render(); }
}
function fillClasses(){
  const cur = fClass.value;
  const cls = [...new Set(ROWS.map(r=>r.class_no).filter(v=>v!=null))].sort((a,b)=>a-b);
  fClass.innerHTML = `<option value="">전체 반</option>` + cls.map(c=>`<option value="${c}">${c}반</option>`).join("");
  fClass.value = cur;
}
function filtered(){
  return ROWS.filter(r=>{
    if(fClass.value && String(r.class_no) !== fClass.value) return false;
    if(fState.value === "done" && r.score == null) return false;
    if(fState.value === "none" && r.score != null) return false;
    return true;
  }).sort((a,b)=>{
    let x = a[sortKey], y = b[sortKey];
    if(x == null) x = sortKey === "score" ? -1 : "";
    if(y == null) y = sortKey === "score" ? -1 : "";
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
}
function sortBy(k){ sortDir = (sortKey === k) ? -sortDir : 1; sortKey = k; render(); }
function render(){
  const rows = filtered();
  const done = rows.filter(r=>r.score != null);
  const avg = done.length ? (done.reduce((s,r)=>s+r.score,0)/done.length).toFixed(1) : "—";
  const full = done.filter(r=>r.score === 40).length;
  kpis.innerHTML = `
    <div class="kpi"><b>${rows.length}</b><span>학생 수</span></div>
    <div class="kpi"><b>${done.length}</b><span>제출</span></div>
    <div class="kpi"><b>${rows.length-done.length}</b><span>미제출</span></div>
    <div class="kpi"><b>${avg}</b><span>평균 점수</span></div>
    <div class="kpi"><b>${full}</b><span>만점</span></div>`;
  tb.innerHTML = rows.map((r,i)=>{
    const ru = r.rubric || {};
    const cells = ORDER.map(k=>{
      const v = ru[k] && ru[k].ok;
      return `<td><span class="dot ${v?"o":"x"}">${r.score==null?"·":(v?"●":"○")}</span></td>`;
    }).join("");
    const cl = r.score == null ? "" : r.score >= 35 ? "a" : r.score >= 25 ? "b" : "c";
    return `<tr onclick="detail(${i})">
      <td>${r.class_no ?? "-"}</td><td>${esc(r.student_no)}</td><td>${esc(r.name)}</td>
      <td class="sc ${cl}">${r.score ?? "—"}</td>${cells}
      <td>${r.elapsed_sec ? Math.round(r.elapsed_sec/60)+"분" : "—"}</td>
      <td>${r.score==null ? "—" : (r.auto_submitted ? "시간종료" : "직접") + (r.tries>1?` (${r.tries}회)`:"")}</td>
      <td><small>${r.created_at ? new Date(r.created_at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "—"}</small></td>
    </tr>`;
  }).join("");
  window.__rows = rows;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function detail(i){
  const r = window.__rows[i]; if(!r) return;
  const ru = r.rubric || {}, sl = r.sim_log || {};
  const wires = (r.wiring||[]).map(w=>`${w.a} → ${String(w.b).replace("mcu.","")}`).join("  ·  ") || "없음";
  const o = document.createElement("div");
  o.className = "overlay"; o.onclick = e=>{ if(e.target===o) o.remove(); };
  o.innerHTML = `<div class="sheet">
    <h2>${r.class_no??"-"}반 ${esc(r.student_no)} ${esc(r.name)}</h2>
    <small>${r.score==null ? "미제출" :
      `${r.score} / 40 · ${Math.round((r.elapsed_sec||0)/60)}분 소요 · ${r.auto_submitted?"시간 종료로 자동 제출":"직접 제출"} · 제출 ${r.tries}회(최고점 표시)`}</small>
    ${r.score==null ? "" : `
    <h3>평가 항목</h3>
    ${ORDER.map((k,i)=>ru[k] ? `<div class="chk ${ru[k].ok?"ok":"no"}"><div class="ic">${ru[k].ok?"✔":"✘"}</div>
       <div>${esc(ru[k].q || ru[k].label)}<br><small>${esc(ru[k].crit||"")} — ${esc(ru[k].label)}</small></div></div>` : "").join("")}
    <h3>구조 확인 문항</h3>
    <pre style="white-space:pre-wrap">${sl.quiz
      ? `${sl.quiz.correct} / ${sl.quiz.total} 정답   ` +
        (sl.quiz.detail||[]).map((q,i)=>`${i+1}번 ${q.ok?"O":"X"}(고른 답 ${q.picked==null?"없음":q.picked+1}번)`).join("  ")
      : "(기록 없음)"}</pre>
    <h3>구조 서술</h3>
    <pre style="white-space:pre-wrap">${esc(sl.explanation) || "(비어 있음)"}</pre>
    <h3>배선</h3>
    <pre style="white-space:pre-wrap">${esc(wires)}</pre>
    <h3>시뮬레이션 결과</h3>
    <pre style="white-space:pre-wrap">가상 경과 ${sl.simHours ?? "?"}시간 · 마지막 습도 ${sl.hum ?? "?"}% · 온도 ${sl.temp ?? "?"}°C · loop ${sl.loops ?? "?"}회</pre>
    <h3>제출 코드</h3>
    <pre>${esc(r.code) || "(없음)"}</pre>`}
    <button class="btn" style="margin-top:18px" onclick="this.closest('.overlay').remove()">닫기</button>
  </div>`;
  document.body.appendChild(o);
}
function csv(){
  const rows = filtered();
  const head = ["반","학번","이름","점수","소요(분)","제출방식","제출시각",
    ...ORDER.map((k,i)=>`${i+1}.${k}`), "문항정답수","구조서술","배선","코드"];
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const body = rows.map(r=>{
    const ru = r.rubric||{}, sl = r.sim_log||{};
    return [r.class_no, r.student_no, r.name, r.score ?? "",
      r.elapsed_sec ? Math.round(r.elapsed_sec/60) : "",
      r.score==null ? "" : (r.auto_submitted?"시간종료":"직접"),
      r.created_at || "",
      ...ORDER.map(k=> ru[k] ? (ru[k].ok?"O":"X") : ""),
      sl.quiz ? `${sl.quiz.correct}/${sl.quiz.total}` : "",
      sl.explanation || "",
      (r.wiring||[]).map(w=>`${w.a}>${String(w.b).replace("mcu.","")}`).join(" "),
      r.code || ""].map(q).join(",");
  });
  const blob = new Blob(["﻿" + [head.map(q).join(","), ...body].join("\r\n")],
    {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `스마트팜_수행평가_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
try{
  const k = sessionStorage.getItem("sf_key");
  if(k){ key.value = k; enter(); }
}catch(e){}
key.addEventListener("keydown", e=>{ if(e.key === "Enter") enter(); });
</script>
</body>
</html>
